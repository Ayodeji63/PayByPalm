name: Verify Skill Installation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Runs twice daily at 06:00 and 18:00 UTC
    - cron: "0 6,18 * * *"
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions

jobs:
  matrix-test:
    name: Install Test (${{ matrix.os }} / Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]

    steps:
      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test one-line install of full Flutterwave skill
        run: npx --yes skills add DevMubarak1/Flutterwave -y

      - name: Verify installed skills list
        run: npx --yes skills list

