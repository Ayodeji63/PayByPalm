services:
  - type: web
    name: paybypalm-backend
    runtime: node
    plan: free
    rootDir: backend
    # TypeScript and its declaration packages are devDependencies, so they must
    # be present during compilation even though the service runs in production.
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: pnpm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Pin the runtime instead of letting an open-ended package.json range
      # resolve to a newly released Node major.
      - key: NODE_VERSION
        value: "22.22.0"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

      # Supabase project settings. Render asks for these during initial
      # Blueprint creation and never stores their values in this repository.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

      # Public production wallet origin, without a trailing slash. Used for CORS
      # and terminal enrolment links. This is public configuration, not a secret.
      - key: WALLET_BASE_URL
        value: https://pay-by-palm.vercel.app
      - key: EXTRA_CORS_ORIGINS
        value: ""

      # Use `mock` until Tencent credentials are available. To enable the real
      # provider, change this value to `tencent` in Render.
      - key: PALM_PROVIDER
        value: mock
      - key: TENCENT_BASE_URL
        value: https://open.intl.palm.tencent.com
      # Secret Tencent Authorization header value. Render prompts for it during
      # Blueprint creation; it is required only when PALM_PROVIDER=tencent.
      - key: TENCENT_PALM_API_KEY
        sync: false
      - key: MOCK_PALM_SCORE
        value: "92"
      - key: PALM_ACCEPT_SCORE
        value: "85"
      - key: PALM_STEP_UP_SCORE
        value: "70"
      - key: MAX_CANDIDATES
        value: "4"

      - key: ENROL_SESSION_TTL_SECONDS
        value: "90"
      - key: AUTH_VALIDITY_SECONDS
        value: "60"
      - key: MAX_IMAGE_BYTES
        value: "2097152"
