services:
  - type: web
    name: paybypalm-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

      # Supabase project settings. Render asks for these during initial
      # Blueprint creation and never stores their values in this repository.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

      # Public URL of the deployed wallet, without a trailing slash, for example
      # https://paybypalm.vercel.app. Used for CORS and terminal enrolment links.
      - key: WALLET_BASE_URL
        sync: false
      - key: EXTRA_CORS_ORIGINS
        value: ""

      # Use `mock` until Tencent credentials are available. To enable the real
      # provider, change this value to `tencent` in Render.
      - key: PALM_PROVIDER
        value: mock
      - key: TENCENT_BASE_URL
        value: https://open.intl.palm.tencent.com
      # Secret Tencent Authorization header value. Render prompts for it during
      # Blueprint creation; it is required only when PALM_PROVIDER=tencent.
      - key: TENCENT_PALM_API_KEY
        sync: false
      - key: MOCK_PALM_SCORE
        value: "92"
      - key: PALM_ACCEPT_SCORE
        value: "85"
      - key: PALM_STEP_UP_SCORE
        value: "70"
      - key: MAX_CANDIDATES
        value: "4"

      - key: ENROL_SESSION_TTL_SECONDS
        value: "90"
      - key: AUTH_VALIDITY_SECONDS
        value: "60"
      - key: MAX_IMAGE_BYTES
        value: "2097152"
